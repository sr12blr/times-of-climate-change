<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="River">
  <defs>
    <clipPath id="tile">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- grassy banks -->
    <rect x="0" y="0" width="64" height="64" fill="#8BC77B"/>
    <!-- winding river -->
    <path d="M43 0 C 43 16, 17 18, 20 32 C 23 45, 47 44, 30 64" fill="none" stroke="#2F7FD0" stroke-width="14"/>
    <!-- water highlight -->
    <path d="M41 2 C 41 16, 17 18, 20 32 C 23 45, 45 44, 29 62" fill="none" stroke="#8FD0FA" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/>
    <!-- trees on the banks -->
    <circle cx="14" cy="14" r="5" fill="#3E8A4F"/>
    <circle cx="51" cy="28" r="5" fill="#3E8A4F"/>
    <circle cx="11" cy="48" r="4.5" fill="#3E8A4F"/>
    <circle cx="53" cy="53" r="3.5" fill="#3E8A4F"/>
  </g>
</svg>
